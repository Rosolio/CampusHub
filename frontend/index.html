<!doctype html>
<html class="light" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusHub</title>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind (CDN) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed-dim": "#83e881",
              "on-secondary-fixed-variant": "#684c00",
              "primary-dim": "#005959",
              "surface-variant": "#97eaf4",
              "on-tertiary-fixed": "#00480f",
              primary: "#006666",
              "tertiary-fixed": "#91f78e",
              "on-error": "#ffefee",
              "inverse-primary": "#8dedec",
              "surface-container-low": "#cbf9ff",
              "on-primary-fixed": "#004343",
              "primary-fixed": "#8dedec",
              "surface-container-high": "#a2eff9",
              outline: "#477f86",
              "inverse-surface": "#001113",
              "outline-variant": "#7eb6be",
              "on-secondary": "#fff1db",
              "on-tertiary-container": "#005e17",
              "on-secondary-container": "#5c4300",
              "surface-bright": "#e1fbff",
              "on-primary-container": "#005858",
              "surface-dim": "#88e2ed",
              "secondary-container": "#ffca53",
              "error-dim": "#9f0519",
              surface: "#e1fbff",
              "surface-container-highest": "#97eaf4",
              "surface-container-lowest": "#ffffff",
              background: "#e1fbff",
              "primary-fixed-dim": "#7fdede",
              "secondary-fixed-dim": "#f8ba00",
              "secondary-fixed": "#ffca53",
              "on-tertiary-fixed-variant": "#00691a",
              "on-error-container": "#570008",
              "on-secondary-fixed": "#453100",
              secondary: "#765600",
              "on-surface-variant": "#29646a",
              error: "#b31b25",
              "primary-container": "#8dedec",
              "on-primary": "#bbfffe",
              "secondary-dim": "#674b00",
              "tertiary-container": "#91f78e",
              "on-background": "#003439",
              tertiary: "#006b1b",
              "error-container": "#fb5151",
              "inverse-on-surface": "#6ea6ad",
              "on-primary-fixed-variant": "#006262",
              "surface-container": "#aef4fd",
              "tertiary-dim": "#005d16",
              "on-tertiary": "#d1ffc8",
              "surface-tint": "#006666",
              "on-surface": "#003439"
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans"],
              body: ["Inter"],
              label: ["Inter"]
            },
            borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" }
          }
        }
      };
    </script>

    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .glass-nav {
        backdrop-filter: blur(20px);
      }
      body {
        background-color: #e1fbff;
        color: #003439;
        font-family: "Inter", sans-serif;
      }
      .text-headline {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .primary-gradient {
        background: linear-gradient(45deg, #006666, #005959);
      }
      .glass-panel {
        background: rgba(225, 251, 255, 0.8);
        backdrop-filter: blur(20px);
      }
      .ghost-border {
        border: 1px solid rgba(126, 182, 190, 0.15);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
