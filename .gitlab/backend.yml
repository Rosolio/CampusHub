# 配置仅供参考！
workflow:
  rules:
    - when: always

stages:
  - quality
  - test
  - build

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  TEST_DB_URL: "jdbc:mysql://mysql:3306/campushub?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
  TEST_DB_USERNAME: "root"
  TEST_DB_PASSWORD: "root"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

cache:
  key: "backend-${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository

backend-checkstyle:
  stage: quality
  image: maven:3.9.9-eclipse-temurin-17
  rules:
    - when: on_success
  script:
    - cd backend
    - mvn -B checkstyle:check

backend-test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  rules:
    - when: on_success
  services:
    - name: mysql:8.0
      alias: mysql
      command:
        - --default-authentication-plugin=mysql_native_password
    - name: redis:7-alpine
      alias: redis
  variables:
    MYSQL_DATABASE: "campushub"
    MYSQL_ROOT_PASSWORD: "root"
  script:
    - cd backend
    - |
      echo "Waiting for MySQL on mysql:3306..."
      for attempt in $(seq 1 60); do
        if (echo > /dev/tcp/mysql/3306) >/dev/null 2>&1; then
          echo "MySQL is reachable."
          break
        fi
        if [ "$attempt" -eq 60 ]; then
          echo "MySQL did not become ready in time." >&2
          exit 1
        fi
        sleep 2
      done
    - mvn -q -DskipTests dependency:build-classpath -Dmdep.outputFile=.ci-test-classpath
    - |
      cat > WaitForMysql.java <<'EOF'
      import java.sql.Connection;
      import java.sql.DriverManager;

      public class WaitForMysql {
          public static void main(String[] args) throws Exception {
              String url = System.getenv("TEST_DB_URL");
              String username = System.getenv("TEST_DB_USERNAME");
              String password = System.getenv("TEST_DB_PASSWORD");
              int maxAttempts = 60;
              for (int attempt = 1; attempt <= maxAttempts; attempt++) {
                  try (Connection ignored = DriverManager.getConnection(url, username, password)) {
                      System.out.println("MySQL accepted JDBC connection on attempt " + attempt + ".");
                      return;
                  } catch (Exception ex) {
                      System.out.println("MySQL JDBC wait attempt " + attempt + " failed: " + ex.getClass().getSimpleName());
                      if (attempt == maxAttempts) {
                          throw ex;
                      }
                      Thread.sleep(2000);
                  }
              }
          }
      }
      EOF
    - mkdir -p .ci-classes
    - javac -cp "$(cat .ci-test-classpath)" -d .ci-classes WaitForMysql.java
    - java -cp ".ci-classes:$(cat .ci-test-classpath)" WaitForMysql
    - |
      echo "Waiting for Redis on redis:6379..."
      for attempt in $(seq 1 60); do
        if (echo > /dev/tcp/redis/6379) >/dev/null 2>&1; then
          echo "Redis is reachable."
          break
        fi
        if [ "$attempt" -eq 60 ]; then
          echo "Redis did not become ready in time." >&2
          exit 1
        fi
        sleep 2
      done
    - mvn -B clean verify
    - awk -F, 'NR>1 {miss+=$8; cov+=$9} END {total=miss+cov; printf("LINE_COVERAGE=%.2f%%\n", (cov/total)*100)}' target/site/jacoco/jacoco.csv
  coverage: '/LINE_COVERAGE=([0-9]+\.[0-9]+)%/'
  artifacts:
    when: always
    paths:
      - backend/target/site/jacoco/
      - backend/target/surefire-reports/
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml

backend-build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  rules:
    - when: on_success
  needs:
    - backend-checkstyle
    - backend-test
  script:
    - cd backend
    - mvn -B clean package -DskipTests
  artifacts:
    when: on_success
    paths:
      - backend/target/campushub-backend-1.0.0.jar
