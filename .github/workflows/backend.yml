name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

env:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  TEST_DB_URL: "jdbc:mysql://127.0.0.1:3306/campushub?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
  TEST_DB_USERNAME: "root"
  TEST_DB_PASSWORD: "root"
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"

jobs:
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: .m2/repository
          key: backend-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: backend-maven-
      - name: Run Checkstyle
        run: |
          cd backend
          mvn -B checkstyle:check

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: campushub
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: .m2/repository
          key: backend-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: backend-maven-
      - name: Run tests
        run: |
          cd backend
          mvn -q -DskipTests dependency:build-classpath -Dmdep.outputFile=.ci-test-classpath
          mkdir -p .ci-classes
          cat > WaitForMysql.java <<'EOF'
          import java.sql.Connection;
          import java.sql.DriverManager;

          public class WaitForMysql {
              public static void main(String[] args) throws Exception {
                  String url = System.getenv("TEST_DB_URL");
                  String username = System.getenv("TEST_DB_USERNAME");
                  String password = System.getenv("TEST_DB_PASSWORD");
                  int maxAttempts = 60;
                  for (int attempt = 1; attempt <= maxAttempts; attempt++) {
                      try (Connection ignored = DriverManager.getConnection(url, username, password)) {
                          System.out.println("MySQL accepted JDBC connection on attempt " + attempt + ".");
                          return;
                      } catch (Exception ex) {
                          System.out.println("MySQL JDBC wait attempt " + attempt + " failed: " + ex.getClass().getSimpleName());
                          if (attempt == maxAttempts) {
                              throw ex;
                          }
                          Thread.sleep(2000);
                      }
                  }
              }
          }
          EOF
          javac -cp "$(cat .ci-test-classpath)" -d .ci-classes WaitForMysql.java
          java -cp ".ci-classes:$(cat .ci-test-classpath)" WaitForMysql
          mvn -B clean verify
          awk -F, 'NR>1 {miss+=$8; cov+=$9} END {total=miss+cov; printf("LINE_COVERAGE=%.2f%%\n", (cov/total)*100)}' target/site/jacoco/jacoco.csv
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [checkstyle, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: .m2/repository
          key: backend-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: backend-maven-
      - name: Build package
        run: |
          cd backend
          mvn -B clean package -DskipTests
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/campushub-backend-1.0.0.jar
